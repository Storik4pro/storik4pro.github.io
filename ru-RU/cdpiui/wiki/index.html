<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDPI UI - Вики</title>
    <link rel="icon" href="/images/app_icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/legacy.css">

</head>
<body class="legacy-body">
    <div id="header"></div>

    <div class="legacy-container">
        <h2 class="legacy">ВИКИ</h2>
        <div class="sub-title-container">
            <span class="font-icon">&#xE8F2;</span>
            <h3 class="legacy">Все страницы вики</h3>
        </div>  
        <div class="flex-container">
            
        </div>
    </div>

    <div id="footer"></div>
    <div id="cookie-banner" class="cookie-banner">
        <div class="cookie-title-banner">
            <img src="/images/cookies.png" alt="cookie icon" class="cookie-icon">
            <h3 class="legacy">Cookies</h3>
        </div>
        
        <p>
            This site uses cookies to save some settings (like your language).
            You can disable cookies in your browser settings — the site will probably still work.
        </p>
        <button id="accept-cookies" class="legacy-button">OK</button>
    </div>
    <script src="/cookieScript.js"></script>
    <script src="script.js"></script>
    <script>
        fetch('/ru-RU/cdpiui/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });
        fetch('/templates/legacyFooter.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        
    </script>
</body>
</html>
